<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="596" viewBox="0 0 1400 596" role="img" aria-label="orchestration-design, a skill for Claude Code and Hermes. Stop paying multi-agent prices for single-agent quality. The gatekeeper: decides exactly how much orchestration your pipeline actually needs. The emergency brake: tactical micro-skills to snap agents out of endless execution loops. Runtime free: designs built for plain code, LangGraph, or any framework you choose. Backed by 2026 AI research — a quoted 90.2 percent multi-agent win cost 15 times the tokens, and 80 percent of the variance was spend rather than architecture. Built by Sachin Sharma, AI systems engineering, MIT licence. Installs in seconds with build.sh.">
